<body>
<div class="card">
  <div class="pill reveal"><span class="dot"></span>Open to PM roles · 2026</div>
  <div class="eyebrow reveal">Product Manager</div>
  <h1 class="name reveal">Anika <em>Badkul</em></h1>
  <p class="tagline reveal">Engineer's brain, product manager's instinct.</p>

  <div class="btns">
    <a class="btn btn-fill reveal" href="/contact-ghc.vcf" id="btn-contact">Save my contact</a>
    <a class="btn btn-outline reveal" href="/resume.pdf" target="_blank" rel="noopener" id="btn-resume">View my résumé</a>
    <a class="btn btn-outline reveal" href="/work.html" id="btn-work">See my work</a>
    <a class="btn btn-outline reveal" href="https://www.linkedin.com/in/anikabadkul" target="_blank" rel="noopener" id="btn-linkedin">Connect on LinkedIn</a>
  </div>
</div>

<footer>Grace Hopper Celebration 2026 · Anaheim</footer>

<script>
(function(){
  function track(name){
    if (window.va) { window.va('event', { name: name }); }
  }
  var map = {
    'btn-contact': 'ghc_tap_save_contact',
    'btn-resume': 'ghc_tap_resume',
    'btn-work': 'ghc_tap_work',
    'btn-linkedin': 'ghc_tap_linkedin'
  };
  Object.keys(map).forEach(function(id){
    var el = document.getElementById(id);
    if (el) el.addEventListener('click', function(){ track(map[id]); });
  });
})();
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
